title: Heureka üben
intro: |
  Knobelaufgaben im Stil eines naturwissenschaftlichen Schülerwettbewerbs: drei Antworten, eine ist richtig.
  Du lernst, wie du Aussagen prüfst, falsche Antworten ausschließt und klug rätst. Dazu gibt es kurze
  Erklärungen und Aufgaben zu Mensch und Tier, Natur und Umwelt sowie Technik und Fortschritt.
  Für die Klassen 5 und 6.
languages:
  - de
chapters:
  - start
  - denken
  - mensch-tier
  - natur-umwelt
  - technik
