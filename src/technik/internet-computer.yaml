# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Internet und Computer
description: "Internet, WLAN und Browser, IP-Adresse, Speicher im Computer, Dateiformate, Phishing, Updates, Hashtag und künstliche Intelligenz."
blocks:
  - type: section
    id: ueberblick
    title: Überblick
    blocks:
      - type: text
        text: |
          Computer und Internet kommen in vielen Wettbewerbsfragen vor. Hier lernst du, was das Internet, ein WLAN
          und ein Browser sind. Du erfährst, wo ein Computer deine Dateien speichert und woran du Phishing erkennst.
          Dazu kommen Dateiformate, Updates, Hashtags und künstliche Intelligenz.
  - type: section
    id: wissen
    title: Das solltest du wissen
    blocks:
      - type: text
        text: |
          **Internet, WLAN und Browser** sind drei verschiedene Dinge. Sie werden oft verwechselt.
      - type: definition
        term: Internet
        explanation: |
          Das Internet ist ein weltweiter Verbund von Rechnernetzwerken. Jeder Computer kann sich darüber mit jedem
          anderen verbinden. Es bietet Dienste an, zum Beispiel E-Mail und das World Wide Web (die Webseiten).
      - type: definition
        term: WLAN
        explanation: |
          Ein WLAN ist ein lokales Funknetz. Es verbindet zum Beispiel dein Handy mit einem Router. Über einen Router
          mit Internetanschluss kommst du von dort ins Internet. Das WLAN selbst ist aber nicht das Internet.
      - type: definition
        term: Browser
        explanation: |
          Ein Browser ist ein Programm, das Webseiten anzeigt. Beispiele sind Firefox, Chrome, Safari und Edge.
      - type: definition
        term: IP-Adresse
        explanation: |
          Eine IP-Adresse sagt, wohin Daten im Netz geschickt werden sollen, ähnlich wie eine Adresse auf einem
          Brief. Eine IPv4-Adresse besteht aus vier Zahlen von 0 bis 255, die durch Punkte getrennt sind, zum
          Beispiel 203.0.113.195. Das Domain Name System (DNS) übersetzt Namen von Webseiten in solche Adressen.
          Man nennt es auch das „automatische Telefonbuch“ des Internets.
      - type: text
        text: |
          **Was im Computer steckt:** Drei Bauteile haben ganz verschiedene Aufgaben.
      - type: table
        caption: Prozessor, Arbeitsspeicher und Festplatte oder SSD
        header: [Bauteil, Aufgabe]
        rowHeaders: true
        rows:
          - [Prozessor, "Das „Gehirn“ des Computers. Er führt die Befehle der Programme aus und rechnet."]
          - [
              Arbeitsspeicher,
              "Hält die Programme und Daten bereit, die gerade laufen. Er ist sehr schnell. Beim Ausschalten gehen seine Daten verloren.",
            ]
          - [
              Festplatte oder SSD,
              "Speichert Programme und Dateien dauerhaft, auch ohne Strom. Sie ist langsamer als der Arbeitsspeicher. Eine SSD speichert in Flash-Speicher und ist schneller als eine Festplatte mit Magnetscheiben.",
            ]
      - type: definition
        term: QR-Code
        explanation: |
          Ein QR-Code ist ein Quadrat aus schwarzen und weißen Feldern. Er enthält Daten, meistens eine
          Internetadresse. Eine Kamera nimmt ihn auf, und eine Software wandelt ihn in Text um. Man sieht dem Code
          nicht an, wohin er führt. Darum prüfst du die Adresse, bevor du sie öffnest.
      - type: table
        caption: Häufige Dateiendungen
        header: [Endung, Was in der Datei steckt]
        rowHeaders: true
        rows:
          - [".jpg", "Ein Bild, zum Beispiel ein Foto (Format JPEG)"]
          - [".mp3", "Ton, zum Beispiel Musik"]
          - [".txt", "Einfacher Text ohne besondere Formatierung, zum Beispiel ohne Fettdruck"]
          - [".pdf", "Ein Dokument, das auf jedem Gerät so aussieht, wie der Autor es angelegt hat"]
      - type: text
        text: |
          **Spam und Phishing:** Spam sind unerwünschte Nachrichten, die an viele Menschen gehen. Oft sind es
          Werbung. Bei **Phishing** geben sich Betrüger als vertrauenswürdig aus, zum Beispiel als Bank oder
          Paketdienst. Sie wollen an Passwörter oder andere Daten kommen.
      - type: note
        title: Woran du Phishing erkennst
        blocks:
          - type: text
            text: |
              - Die Nachricht spricht dich allgemein an, zum Beispiel mit „Sehr geehrter Kunde“.
              - Sie setzt dich unter Druck, etwa mit „Dein Konto wird gesperrt“.
              - Sie will Passwörter, PIN oder TAN wissen. Echte Firmen fragen das nicht per E-Mail ab.
              - Der Link führt woanders hin, als sein Text sagt.

              Klicke dann nicht. Frage lieber auf dem offiziellen Weg nach.
      - type: definition
        term: Software-Update
        explanation: |
          Ein Update bringt ein Programm auf einen neueren Stand. Es kann Fehler beheben, Sicherheitslücken
          schließen und neue Funktionen bringen.
      - type: definition
        term: Hashtag
        explanation: |
          Ein Hashtag ist ein Schlagwort mit dem Zeichen # davor, zum Beispiel #Wald. Leerzeichen und Satzzeichen
          sind darin nicht erlaubt. Wer nach einem Hashtag sucht, findet alle Beiträge, die damit gekennzeichnet sind.
      - type: definition
        term: Künstliche Intelligenz (KI)
        explanation: |
          KI sind Computerprogramme, die aus dem, was sie wahrnehmen, selbst entscheiden, was sie tun. Sie können zum
          Beispiel Bilder erkennen, Sprache in Text umwandeln und Texte übersetzen.
      - type: note
        title: KI macht Fehler
        blocks:
          - type: text
            text: |
              Eine KI kann Antworten erfinden, die überzeugend klingen und trotzdem falsch sind. Sie versteht die
              Welt nicht wie ein Mensch und hat keine Gefühle. Wichtige Antworten prüfst du darum mit einer zweiten
              Quelle.
      - type: example
        title: So gehst du bei „Welche Aussage ist falsch?“ vor
        blocks:
          - type: text
            text: |
              **Frage:** Welche Aussage über den Computer ist falsch?

              1. Der Prozessor führt die Befehle von Programmen aus.
              2. Der Arbeitsspeicher behält seine Daten auch ohne Strom.
              3. Eine SSD speichert Dateien dauerhaft.
          - type: text
            text: |
              **So denkst du:** Gesucht ist die eine Aussage, die nicht stimmt. Die anderen beiden stimmen. Prüfe
              jede Aussage einzeln und frage dich: Stimmt das?

              - Aussage 1: Ja, das ist die Aufgabe des Prozessors. Sie stimmt.
              - Aussage 2: Der Arbeitsspeicher verliert seine Daten beim Ausschalten. Hier steht das Gegenteil. Sie ist falsch.
              - Aussage 3: Ja, eine SSD ist ein dauerhafter Speicher. Sie stimmt.

              **Antwort:** Aussage 2. Prüfe trotzdem alle drei. So bemerkst du, wenn du dich verlesen hast.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: internet-falsche-aussage
        text: Welche Aussage ist falsch?
        options:
          - text: Das World Wide Web ist ein Teil des Internets.
            correct: false
            info: Das stimmt. Das Web ist nur einer von mehreren Diensten im Internet, ein anderer ist E-Mail.
          - text: Eine IP-Adresse sagt, wohin im Netz Daten geschickt werden sollen.
            correct: false
            info: Das stimmt. Eine IP-Adresse wirkt wie die Adresse auf einem Brief.
          - text: Ein Browser ist ein Funkgerät, das ein WLAN aufbaut.
            correct: true
            info: Das ist falsch. Ein Browser ist ein Programm, das Webseiten anzeigt. Ein WLAN stellt ein Gerät wie ein Router her.
        explanation: Ein Browser zeigt Webseiten an, mehr nicht. Das Funknetz baut der Router auf. Das Web ist nur ein Dienst im Internet.
        hint: Überlege, ob ein Browser etwas ist, das man anfassen kann, oder etwas, das auf dem Gerät läuft.
        links:
          - { title: Webbrowser (Wikipedia), url: "https://de.wikipedia.org/wiki/Webbrowser" }
          - { title: Internet (Wikipedia), url: "https://de.wikipedia.org/wiki/Internet" }
          - {
              title: Wireless Local Area Network (Wikipedia),
              url: "https://de.wikipedia.org/wiki/Wireless_Local_Area_Network",
            }
          - { title: IP-Adresse (Wikipedia), url: "https://de.wikipedia.org/wiki/IP-Adresse" }
      - type: single-choice
        id: internet-speicher
        text: Du schaltest deinen Computer aus. Wo bleiben deine gespeicherten Fotos erhalten?
        options:
          - text: im Arbeitsspeicher
            correct: false
            info: Der Arbeitsspeicher hält nur Daten bereit, die gerade gebraucht werden. Beim Ausschalten sind sie weg.
          - text: auf der Festplatte oder SSD
            correct: true
            info: Festplatte und SSD speichern dauerhaft, auch ohne Strom.
          - text: im Prozessor
            correct: false
            info: Der Prozessor rechnet und führt Befehle aus. Zum dauerhaften Speichern dient er nicht.
        explanation: Dateien liegen auf der Festplatte oder SSD. Der Arbeitsspeicher ist nur ein schneller Zwischenspeicher für laufende Programme.
        links:
          - { title: Arbeitsspeicher (Wikipedia), url: "https://de.wikipedia.org/wiki/Arbeitsspeicher" }
          - { title: Festplattenlaufwerk (Wikipedia), url: "https://de.wikipedia.org/wiki/Festplattenlaufwerk" }
          - { title: Hauptprozessor (Wikipedia), url: "https://de.wikipedia.org/wiki/Hauptprozessor" }
      - type: matching
        id: internet-endungen
        text: Ordne jeder Dateiendung zu, was in der Datei steckt.
        pairs:
          - { left: ".jpg", right: Ein Foto }
          - { left: ".mp3", right: Musik }
          - { left: ".txt", right: Einfacher Text ohne Formatierung }
          - { left: ".pdf", right: "Ein Dokument, das überall gleich aussieht" }
        distractors: [Ein Videofilm, Ein Computerspiel]
        explanation: JPEG ist ein Format für Fotos, MP3 für Ton, eine Textdatei enthält nur Zeichen, und PDF zeigt ein Dokument auf jedem Gerät gleich an.
        links:
          - { title: JPEG (Wikipedia), url: "https://de.wikipedia.org/wiki/JPEG" }
          - { title: MP3 (Wikipedia), url: "https://de.wikipedia.org/wiki/MP3" }
          - { title: Textdatei (Wikipedia), url: "https://de.wikipedia.org/wiki/Textdatei" }
          - {
              title: Portable Document Format (Wikipedia),
              url: "https://de.wikipedia.org/wiki/Portable_Document_Format",
            }
      - type: true-false
        id: internet-phishing
        text: Eine E-Mail mit dem Logo deiner Bank und der Anrede „Sehr geehrter Kunde“ ist sicher echt.
        answer: false
        explanation: Betrüger bauen echte Seiten und Nachrichten täuschend ähnlich nach. Eine allgemeine Anrede ist ein Warnzeichen für Phishing. Echte Firmen fragen auch nicht per E-Mail nach deinem Passwort.
        links:
          - { title: Phishing (Wikipedia), url: "https://de.wikipedia.org/wiki/Phishing" }
          - { title: Spam (Wikipedia), url: "https://de.wikipedia.org/wiki/Spam" }
      - type: single-choice
        id: internet-ki
        text: Eine KI gibt dir eine Antwort, die sehr sicher klingt. Was ist klug?
        options:
          - text: Der Antwort glauben, weil ein Computer immer richtig rechnet.
            correct: false
            info: Eine KI rechnet nicht nur, sie erzeugt Antworten aus ihrem Training. Dabei macht sie Fehler.
          - text: Wichtige Antworten mit einer zweiten Quelle prüfen.
            correct: true
            info: Eine KI kann Antworten erfinden, die überzeugend klingen und falsch sind. Eine zweite Quelle hilft dir, das zu bemerken.
          - text: Nur die Antworten prüfen, die unsicher klingen.
            correct: false
            info: Eine KI klingt oft auch dann sicher, wenn die Antwort falsch ist. Der Ton sagt nichts über die Richtigkeit.
        explanation: KI ist hilfreich, kann aber Fehler machen. Wichtiges prüfst du immer nach.
        links:
          - { title: Künstliche Intelligenz (Wikipedia), url: "https://de.wikipedia.org/wiki/Künstliche_Intelligenz" }
      - type: single-choice
        id: internet-aussagen
        text: Welche Aussage ist falsch?
        options:
          - text: Ein QR-Code kann eine Internetadresse enthalten, die dein Handy mit der Kamera liest.
            correct: false
            info: Das stimmt. Meistens enthalten QR-Codes eine Internetadresse.
          - text: Ein Hashtag ist ein Schlagwort mit dem Zeichen # davor.
            correct: false
            info: Das stimmt. Über Hashtags findet man Beiträge zu einem Thema.
          - text: Ein Software-Update ändert nur das Aussehen eines Programms.
            correct: true
            info: Das ist falsch. Ein Update kann auch Fehler beheben und Sicherheitslücken schließen.
        explanation: Updates sind mehr als Kosmetik. Sie bringen Programme auf einen neueren Stand, zum Beispiel mit behobenen Fehlern und geschlossenen Sicherheitslücken.
        hint: Überlege, warum Handys und Computer dich immer wieder um Updates bitten.
        links:
          - { title: Softwareaktualisierung (Wikipedia), url: "https://de.wikipedia.org/wiki/Softwareaktualisierung" }
          - { title: QR-Code (Wikipedia), url: "https://de.wikipedia.org/wiki/QR-Code" }
          - { title: Hashtag (Wikipedia), url: "https://de.wikipedia.org/wiki/Hashtag" }
